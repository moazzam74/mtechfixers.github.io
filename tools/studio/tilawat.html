<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Amiri'; font-weight: 400; src: url('../../brand/fonts/amiri-arabic-400-normal.woff2'); }
@font-face { font-family: 'Amiri'; font-weight: 700; src: url('../../brand/fonts/amiri-arabic-700-normal.woff2'); }
@font-face { font-family: 'Nastaliq'; font-weight: 400; src: url('../../brand/fonts/noto-nastaliq-urdu-arabic-400-normal.woff2'); }
@font-face { font-family: 'Nastaliq'; font-weight: 700; src: url('../../brand/fonts/noto-nastaliq-urdu-arabic-700-normal.woff2'); }
@font-face { font-family: 'Cormorant'; font-weight: 700; src: url('../../brand/fonts/cormorant-garamond-latin-700-normal.woff2'); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url('../../brand/fonts/inter-latin-600-normal.woff2'); }
:root { --green: #0d4a3a; --gold: #b8893a; --gold2: #d9b26a; --paper: #fbf6ea; --ink: #1f2a26; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; }
body { background: var(--paper); overflow: hidden; -webkit-font-smoothing: antialiased; }
.canvas { position: relative; width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(1200px 900px at 50% 0%, #fffdf6 0%, rgba(255,253,246,0) 70%), radial-gradient(900px 800px at 50% 110%, rgba(19,98,77,.10), transparent 70%), var(--paper); }
.pattern { position: absolute; inset: 0; opacity: .14; }
.frame { position: absolute; inset: 34px; border: 3px solid var(--gold); border-radius: 26px; }
.frame::after { content: ''; position: absolute; inset: 12px; border: 1.5px solid var(--gold2); border-radius: 18px; }
.corner { position: absolute; width: 120px; height: 120px; }
.abs { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 14px; background: var(--green); color: #f6e7c6; border-radius: 999px; padding: 14px 36px;
  font: 700 28px 'Cormorant'; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 12px 26px -14px rgba(13,74,58,.7); }
.pill .ur2 { font: 700 32px/1 'Nastaliq'; letter-spacing: 0; padding-top: 8px; color: #f3d99a; }
.pill .sep { width: 2px; height: 30px; background: rgba(243,217,154,.5); }
.surah { direction: rtl; font: 700 76px/1.5 'Amiri'; color: var(--green); }
.surah-en { font: 700 34px 'Cormorant'; color: #6b4d17; letter-spacing: .06em; }
.bism { direction: rtl; font: 700 46px/1.5 'Amiri'; color: #8a6a2c; }
.box { position: absolute; left: 90px; right: 90px; }
.ayah { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; opacity: 0; }
.ar { direction: rtl; text-align: center; font: 700 84px/1.8 'Amiri'; color: var(--green); width: 100%; }
.ur { direction: rtl; text-align: center; font: 400 46px/2.05 'Nastaliq'; color: var(--ink); width: 100%; }
.div { width: 260px; height: 26px; flex: none; }
.qari { direction: rtl; font: 700 34px/1.9 'Nastaliq'; color: #6b4d17; }
.qari-en { font: 700 26px 'Cormorant'; color: #6b4d17; letter-spacing: .08em; text-transform: uppercase; }
.bar { width: 620px; height: 8px; border-radius: 8px; background: rgba(184,137,58,.22); overflow: hidden; margin-top: 18px; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #b8893a, #d9b26a); border-radius: 8px; }
.foot { position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 22px; color: var(--green); font: 600 24px 'Inter'; }
.foot img { height: 62px; }
.foot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
</style>
<script>/*__DATA__*/</script>
</head><body><div class="canvas" id="c"></div>
<script>
const D = window.DATA || {};
const ROOT = D._root || '../../';
const c = document.getElementById('c');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const add = (html, style) => { const d = document.createElement('div'); d.innerHTML = html.trim(); const n = d.firstChild; if (style) Object.assign(n.style, style); c.appendChild(n); return n; };
const AY = D.ayahs || [];
const SEGS = D._segs || AY.map((a, i) => [1.2 + i * 6, 1.2 + i * 6 + 5.5]);
window.DURATION = D._dur || (SEGS.length ? SEGS[SEGS.length - 1][1] + 2 : 10);

add(`<svg class="pattern" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="p" width="120" height="120" patternUnits="userSpaceOnUse">
  <g fill="none" stroke="#b8893a" stroke-width="2"><rect x="35" y="35" width="50" height="50"/><rect x="35" y="35" width="50" height="50" transform="rotate(45 60 60)"/>
  <circle cx="60" cy="60" r="9"/><path d="M0 0 L25 25 M120 0 L95 25 M0 120 L25 95 M120 120 L95 95"/></g></pattern></defs><rect width="100%" height="100%" fill="url(#p)"/></svg>`);
add(`<div class="frame"></div>`);
const CORNER = `<svg viewBox="0 0 120 120"><g fill="none" stroke="#b8893a" stroke-width="3" stroke-linecap="round"><path d="M10 70 C 10 35, 35 10, 70 10"/><path d="M24 70 C 24 44, 44 24, 70 24"/><circle cx="24" cy="24" r="7" fill="#d9b26a" stroke="none"/></g></svg>`;
[['left:40px;top:40px', ''], ['right:40px;top:40px', 'scaleX(-1)'], ['left:40px;bottom:40px', 'scaleY(-1)'], ['right:40px;bottom:40px', 'scale(-1,-1)']].forEach(([pos, tf]) =>
  add(`<div class="corner" style="${pos};transform:${tf}">${CORNER}</div>`));
const ORN = `<svg width="420" height="34" viewBox="0 0 420 34"><g fill="none" stroke="#b8893a" stroke-width="2.4" stroke-linecap="round"><path d="M10 17 H160"/><path d="M260 17 H410"/>
  <path d="M170 17 L190 5 L210 17 L190 29 Z" fill="#d9b26a"/><path d="M210 17 L230 5 L250 17 L230 29 Z"/><circle cx="160" cy="17" r="3.5" fill="#b8893a"/><circle cx="260" cy="17" r="3.5" fill="#b8893a"/></g></svg>`;
const DIV = `<svg class="div" viewBox="0 0 260 26"><g fill="none" stroke="#b8893a" stroke-width="2" stroke-linecap="round"><path d="M10 13 H100 M160 13 H250"/><path d="M130 3 L140 13 L130 23 L120 13 Z" fill="#d9b26a"/><circle cx="108" cy="13" r="3" fill="#b8893a"/><circle cx="152" cy="13" r="3" fill="#b8893a"/></g></svg>`;

const head = add(`<div class="abs" style="top:150px;gap:20px">
  <div class="pill"><span>Tilawat</span><span class="sep"></span><span class="ur2">تلاوتِ قرآن</span></div>${ORN}
  <div class="surah">${esc(D.surah_ar)}</div><div class="surah-en">${esc(D.ref_en)}</div>
  ${D.bismillah ? '<div class="bism">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>' : ''}</div>`);
const box = add(`<div class="box" style="top:520px;bottom:450px"></div>`);
const blocks = AY.map(a => { const d = document.createElement('div'); d.className = 'ayah';
  d.innerHTML = `<div class="ar">${esc(a.ar)}</div>${DIV}<div class="ur">${esc(a.ur)}</div>`; box.appendChild(d); return d; });
const low = add(`<div class="abs" style="top:1528px;gap:2px">
  <div class="qari">تلاوت: شیخ مشاری راشد العفاسی</div><div class="qari-en">Recitation · Mishary Rashid Alafasy</div><div class="bar"><i id="bar"></i></div></div>`);
add(`<div class="foot" style="bottom:120px"><img src="${ROOT}brand/eoi-logo.png" onerror="this.style.display='none'"><span class="dot"></span><span>@educationofislam9</span><span class="dot"></span><span>educationofislam.com</span></div>`);

function fit(b) {
  const ar = b.querySelector('.ar'), ur = b.querySelector('.ur');
  let a = 92, u = 50; const avail = box.clientHeight;
  const h = () => ar.scrollHeight + ur.scrollHeight + 26 + 60;
  ar.style.fontSize = a + 'px'; ur.style.fontSize = u + 'px';
  while (h() > avail && a > 36) { a -= 2; u = Math.max(28, u - 0.9); ar.style.fontSize = a + 'px'; ur.style.fontSize = u + 'px'; }
}

const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
window.TICK = ms => {
  const t = ms / 1000;
  const intro = ease(t / 0.9);
  head.style.opacity = intro; head.style.transform = `translateY(${(1 - intro) * 24}px)`;
  low.style.opacity = ease((t - 0.4) / 0.8);
  blocks.forEach((b, i) => {
    const s = SEGS[i][0] - 0.35, e = i + 1 < SEGS.length ? SEGS[i + 1][0] - 0.35 : 1e9;
    const fin = ease((t - s) / 0.45), fout = ease((t - e) / 0.35);
    const o = t < s ? 0 : t < e ? fin : 1 - fout;
    b.style.opacity = o; b.style.transform = `translateY(${(1 - fin) * 30}px)`;
  });
  document.getElementById('bar').style.width = (clamp(t / window.DURATION, 0, 1) * 100) + '%';
};

const FONTS = [document.fonts.load('700 40px Amiri', 'بسم'), document.fonts.load('400 40px Nastaliq', 'حدیث'), document.fonts.load('700 40px Nastaliq', 'حدیث'),
  document.fonts.load('700 30px Cormorant'), document.fonts.load('600 20px Inter')];
Promise.all(FONTS).then(() => {
  box.style.top = (150 + head.offsetHeight + 40) + 'px';
  blocks.forEach(fit);
  window.TICK(0);
  Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })))
    .then(() => setTimeout(() => { window.READY = true; }, 200));
});
</script></body></html>
